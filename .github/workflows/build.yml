name: Windows 构建与测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 还原依赖
        run: dotnet restore .\事务所出报告批量排版WPF版.csproj
      - name: Release 构建
        run: dotnet build .\事务所出报告批量排版WPF版.csproj -c Release --no-restore
      - name: 自动测试
        run: dotnet test .\开发测试\文档快照导出测试\文档快照导出测试.csproj -c Release
